---
# Nornir 3 configuration. Paths are relative to the repository root;
# scripts/common.py resolves them, so scripts can run from any directory.
runner:
  plugin: threaded
  options:
    num_workers: 10

inventory:
  plugin: SimpleInventory
  options:
    host_file: inventory/hosts.yaml
    group_file: inventory/groups.yaml

logging:
  enabled: true
  level: INFO
  log_file: logs/nornir.log
