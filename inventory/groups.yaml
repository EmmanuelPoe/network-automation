---
# Credentials are NOT stored here. scripts/common.py sets username/password on
# every host at runtime from DEVICE_USERNAME / DEVICE_PASSWORD (or a prompt).
cisco_ios:
  platform: cisco_ios
  port: 22

cisco_nxos:
  platform: cisco_nxos
  port: 22

core:
  data:
    role: core
    backup_priority: 1

distribution:
  data:
    role: distribution
    backup_priority: 2

access:
  data:
    role: access
    backup_priority: 3
